[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "awa-cli"
version = "0.1.0"
description = "Windows 上的微信公众号文章采集命令行工具：自动定位公众号主页、批量采集文章详情并落库归档。"
readme = "README.md"
requires-python = ">=3.13"
license = "CC-BY-NC-SA-4.0"
license-files = ["LICENSE"]
dependencies = [
    "mitmproxy>=12.2.3",
    "uiautomation>=2.0.29",
    "psutil>=7.2.2",
    "requests>=2.34.2",
    "huey>=3.3.4",
    "ruamel-yaml>=0.19.1",
    "playwright>=1.60.0",
    "cryptography>=48.0.1",
]

[project.scripts]
awa = "awa.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["awa"]

[dependency-groups]
dev = ["pytest>=8"]
